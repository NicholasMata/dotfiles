onboarding = false
[theme]
name = "rose-pine"
auto_switch = true
light_name = "rose-pine-dawn"
dark_name = "rose-pine"

[terminal]
new_cwd = "follow"
shell_mode = "auto"

[keys]
prefix = "ctrl+space"

settings = "prefix+shift+s"

# Match the visual split keys used in Neovim.
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

goto = "prefix+space"
# Workspace picker list
navigate_workspace_up = "k"
navigate_workspace_down = "j"

previous_agent = "ctrl+shift+p"
next_agent = "ctrl+shift+n"

toggle_sidebar = "prefix+e"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true
